name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests and CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Generate sample signals
        run: python modulation_signal_generator.py --output-dir /tmp/modulation-samples --samples 128 --seed 42
      - name: Train and evaluate model
        run: python modulation_recognition.py train --samples-per-class 20 --signal-length 128 --seed 42 --model /tmp/modulation-model.pkl
      - name: Predict a generated signal
        run: python modulation_recognition.py predict /tmp/modulation-samples/QPSK_sample.txt --model /tmp/modulation-model.pkl
